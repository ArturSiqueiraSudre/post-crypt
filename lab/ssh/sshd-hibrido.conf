# Laboratório SSH (Docker): OpenSSH com a configuração padrão de algoritmos.
# No OpenSSH 9.0+ isso já inclui troca de chave híbrida pós-quântica.
# Ninguém entra: senha, teclado e chave pública ficam desligados.
Port 2222
HostKey /etc/ssh/ssh_host_rsa_key
HostKey /etc/ssh/ssh_host_ecdsa_key
HostKey /etc/ssh/ssh_host_ed25519_key
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication no
PidFile /run/sshd-hibrido.pid
