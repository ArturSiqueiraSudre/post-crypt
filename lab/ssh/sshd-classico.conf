# Laboratório SSH (Docker): só troca de chave clássica, com algoritmos legados
# de propósito (gabarito: KX_CLASSICAL_ONLY, SSH_WEAK_KEX, SSH_WEAK_CIPHER,
# SSH_WEAK_HOST_KEY). Ninguém entra: autenticação toda desligada.
Port 2223
HostKey /etc/ssh/ssh_host_rsa_key
HostKey /etc/ssh/ssh_host_ed25519_key
KexAlgorithms curve25519-sha256,ecdh-sha2-nistp256,diffie-hellman-group14-sha1
Ciphers aes128-ctr,aes256-ctr,aes128-cbc
HostKeyAlgorithms ssh-rsa,rsa-sha2-512,ssh-ed25519
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication no
PidFile /run/sshd-classico.pid
