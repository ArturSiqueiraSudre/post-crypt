# Achados de rede esperados na varredura do laboratório (Estágio 1: correlação).
# Cada achado lista os serviços que precisa apontar, pelos nomes do escopo.
# Todos os certificados do laboratório saem da mesma CA clássica (EC P-384),
# gerada por lab/gerar_certificados.py: é o caso de ponto único de falha.
NET_SHARED_CLASSICAL_CA: [tls-hibrido, tls-classico, tls-legado, tls-vencendo, tls-vencido, tls-desconhecido]
NET_HNDL_EXPOSURE: [tls-classico, tls-legado, ssh-classico]
NET_VISIBILITY_GAP: [desligado]
# Estágio 2: OpenSSL 3.0.13 (sem suporte desde 07/09/2026) declarado por dois
# serviços do laboratório em Python. No Docker este achado não se aplica.
NET_OUTDATED_VERSION: [tls-classico, tls-legado]
