# Laboratório do Post-Crypt: um nginx com OpenSSL 3.5+, um servidor por porta.
# Cada servidor representa um caso do gabarito (lab/gabarito.yaml).

worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }

http {
    access_log off;
    ssl_session_cache off;

    # 8441 — padrões do OpenSSL 3.5: oferece X25519MLKEM768 (híbrido PQC)
    server {
        listen 8441 ssl;
        server_name tls-hibrido.lab;
        ssl_certificate     /etc/nginx/certs/tls-hibrido.pem;
        ssl_certificate_key /etc/nginx/certs/tls-hibrido.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        return 200 "tls-hibrido\n";
    }

    # 8442 — só grupos clássicos: vulnerável a Harvest Now, Decrypt Later
    server {
        listen 8442 ssl;
        server_name tls-classico.lab;
        ssl_certificate     /etc/nginx/certs/tls-classico.pem;
        ssl_certificate_key /etc/nginx/certs/tls-classico.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ecdh_curve X25519:prime256v1;
        return 200 "tls-classico\n";
    }

    # 8443 — TLS 1.2 com troca de chave RSA: sem sigilo futuro
    server {
        listen 8443 ssl;
        server_name tls-legado.lab;
        ssl_certificate     /etc/nginx/certs/tls-legado.pem;
        ssl_certificate_key /etc/nginx/certs/tls-legado.key;
        ssl_protocols TLSv1.2;
        ssl_ciphers AES256-GCM-SHA384;
        return 200 "tls-legado\n";
    }

    # 8444 — certificado vence em 10 dias
    server {
        listen 8444 ssl;
        server_name tls-vencendo.lab;
        ssl_certificate     /etc/nginx/certs/tls-vencendo.pem;
        ssl_certificate_key /etc/nginx/certs/tls-vencendo.key;
        return 200 "tls-vencendo\n";
    }

    # 8445 — certificado vencido
    server {
        listen 8445 ssl;
        server_name tls-vencido.lab;
        ssl_certificate     /etc/nginx/certs/tls-vencido.pem;
        ssl_certificate_key /etc/nginx/certs/tls-vencido.key;
        return 200 "tls-vencido\n";
    }
}
