# Regras de classificação do Post-Crypt.
#
# As regras ficam em dados, não em código: quando um padrão mudar (um grupo
# novo, uma data revisada pelo NIST), atualiza-se este arquivo, e a ferramenta
# continua a mesma. Isso é cripto-agilidade aplicada à própria ferramenta.
#
# Para usar regras próprias: postcrypt scan escopo.yaml --rules minhas-regras.yaml

version: 1
updated: "2026-11-20"

references:
  - id: FIPS-203
    title: "NIST FIPS 203 — Module-Lattice-Based Key-Encapsulation Mechanism Standard (ML-KEM), 2024"
  - id: FIPS-204
    title: "NIST FIPS 204 — Module-Lattice-Based Digital Signature Standard (ML-DSA), 2024"
  - id: NIST-IR-8547
    title: "NIST IR 8547 (rascunho, nov. 2024) — Transition to Post-Quantum Cryptography Standards"
  - id: RFC-8446
    title: "RFC 8446 — The Transport Layer Security (TLS) Protocol Version 1.3"
  - id: DRAFT-ECDHE-MLKEM
    title: "draft-ietf-tls-ecdhe-mlkem — Post-quantum hybrid ECDHE-MLKEM Key Agreement for TLSv1.3"
  - id: RFC-9110
    title: "RFC 9110 — HTTP Semantics (campo Server: produto/versão e comentários)"
  - id: OPENSSL-RELEASE
    title: "OpenSSL Release Strategy (openssl-library.org/policies/releasestrat), mai. 2026"
  - id: NGINX-NEWS
    title: "nginx.org — notícias de versões; ramos 1.30 (estável) e 1.31 (mainline) em nov. 2026"
  - id: PHP-SUPPORTED
    title: "php.net/supported-versions — 8.2 com suporte de segurança até 31/12/2026"

# Troca de chave: é aqui que mora o risco "Harvest Now, Decrypt Later".
key_exchange_groups:
  X25519MLKEM768: hybrid
  SecP256r1MLKEM768: hybrid
  SecP384r1MLKEM1024: hybrid
  MLKEM512: pure
  MLKEM768: pure
  MLKEM1024: pure
  X25519Kyber768Draft00: obsolete   # pré-padrão; navegadores já removeram
  x25519: classical
  x448: classical
  secp256r1: classical
  secp384r1: classical
  secp521r1: classical
  ffdhe2048: classical
  ffdhe3072: classical
  ffdhe4096: classical
  ffdhe6144: classical
  ffdhe8192: classical

# Cifra simétrica: Grover reduz a margem pela metade; AES-256 segue robusto.
symmetric:
  AES_256_GCM: { status: ok }
  CHACHA20_POLY1305: { status: ok }
  AES_256_CBC: { status: ok }
  AES_128_GCM: { status: ok, note: "Aceito pelo NIST; a CNSA 2.0 exige AES-256." }
  AES_128_CCM: { status: ok, note: "Aceito pelo NIST; a CNSA 2.0 exige AES-256." }
  AES_128_CBC: { status: ok, note: "Aceito pelo NIST; a CNSA 2.0 exige AES-256." }
  3DES_EDE_CBC: { status: weak, note: "3DES é fraco mesmo sem computador quântico." }

# Chave pública do certificado (autenticação). Não é risco HNDL: assinatura
# quebrada no futuro não decifra tráfego gravado, mas precisa migrar antes.
# Datas do NIST IR 8547 (rascunho): 112 bits de segurança são depreciados
# após 2030; tudo que é vulnerável a quântico é proibido após 2035.
public_keys:
  RSA:
    quantum_vulnerable: true
    deprecated_after_if_bits_below: { bits: 3072, year: 2030 }
    disallowed_after: 2035
  EC:
    quantum_vulnerable: true
    deprecated_after_if_bits_below: { bits: 256, year: 2030 }
    disallowed_after: 2035
  Ed25519: { quantum_vulnerable: true, disallowed_after: 2035 }
  Ed448: { quantum_vulnerable: true, disallowed_after: 2035 }
  ML-DSA-44: { quantum_vulnerable: false }
  ML-DSA-65: { quantum_vulnerable: false }
  ML-DSA-87: { quantum_vulnerable: false }

certificates:
  expiry_warning_days: 30   # RTS (UE) 2024/1774, art. 7(5): renovar antes do vencimento

# Correlação de rede (postcrypt.network): achados que relacionam vários alvos.
# A prioridade de cada achado é severidade × quantos alvos ele afeta.
network:
  # Fração dos ativos próprios avaliados que só fazem troca de chave clássica.
  hndl_exposure: { high: 0.5, medium: 0.25 }      # abaixo disso: low
  # Fração do escopo sem resposta ou sob responsabilidade de terceiros.
  visibility_gap: { high: 0.5, medium: 0.25 }     # abaixo disso: low

# Quando a CA não vem na cadeia, a família da chave dela sai do algoritmo com
# que o certificado do servidor foi assinado: trecho do nome -> entrada de
# public_keys. A primeira correspondência vale.
signature_families:
  "2.16.840.1.101.3.4.3.17": ML-DSA-44
  "2.16.840.1.101.3.4.3.18": ML-DSA-65
  "2.16.840.1.101.3.4.3.19": ML-DSA-87
  ml-dsa-44: ML-DSA-44
  ml-dsa-65: ML-DSA-65
  ml-dsa-87: ML-DSA-87
  rsa: RSA
  ecdsa: EC
  ed25519: Ed25519
  ed448: Ed448

# Fingerprint de versão (postcrypt.fingerprint, decisão 0002). Identifica o
# software pelo que o próprio servidor declara (cabeçalhos Server e
# X-Powered-By) e diz se o fabricante ainda corrige aquela versão. Não julga
# a criptografia: isso continua com as regras acima.
#
# "supported" lista o que tinha suporte na data de "updated":
#   "3.5"   -> qualquer 3.5.x
#   ">=4.0" -> 4.0 ou mais nova
# Suporte muda com o calendário dos fabricantes: revise esta seção sempre que
# atualizar "updated". Produto sem regra aparece como "não avaliado".
fingerprint:
  products:
    nginx:
      label: nginx
      tokens: [nginx]
      supported: [">=1.30"]          # 1.28 e 1.29 sem correções desde abr./mai. 2026
    apache:
      label: Apache httpd
      tokens: [Apache]
      supported: [">=2.4"]           # 2.2 sem suporte desde 2018
    iis:
      label: Microsoft IIS
      tokens: [Microsoft-IIS]
      supported: [">=10.0"]          # 8.5 e anteriores acompanham Windows sem suporte
    openssl:
      label: OpenSSL
      tokens: [OpenSSL]
      supported: ["3.5", ">=4.0"]    # 3.0 (LTS) saiu em 07/09/2026; 3.4 e 3.6 em out./nov. 2026
      note: "O OpenSSL só negocia troca de chave híbrida com ML-KEM a partir do 3.5."
    php:
      label: PHP
      tokens: [PHP]
      supported: [">=8.2"]           # 8.1 sem suporte desde 31/12/2025

  # Comentário do cabeçalho que indica pacote de distribuição, cujas correções
  # às vezes chegam sem mudar o número da versão ("Apache/2.4.58 (Ubuntu)").
  # Só esses nomes geram o aviso; "(Win64)", por exemplo, não.
  distributions:
    - Ubuntu
    - Debian
    - Red Hat
    - RHEL
    - CentOS
    - Rocky
    - AlmaLinux
    - Oracle Linux
    - Fedora
    - SUSE
    - Alpine
    - Amazon Linux

  # Assinaturas de pilha TLS (estilo JA4S, só comparáveis entre varreduras do
  # Post-Crypt) -> nome da pilha. Fica vazio até haver gabarito de campo: uma
  # assinatura sem entrada aparece como "pilha não identificada", nunca como
  # chute. Exemplo de entrada:
  #   t120400_c030_0123456789ab: "OpenSSL 3.5 (nginx 1.30)"
  tls_stacks: {}
